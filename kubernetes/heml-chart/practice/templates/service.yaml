apiVersion: v2
kind: service
metadata: 
  name: {{ include "my-app.fullName" . }}
  labels: 
     {{- include "my-app.lables" . | nindent 4 }}
  spec: 
    type: {{ .Values.service.type }}
    ports:
     - port: {{ .Values.service.port }}
       targetPort: http 
       protocol: http 
       name: http 
    selector:
         {{- include "my-app.selectorLabels" . | nindent 4 }}
                